name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and run tests
        run: ./gradlew test --no-daemon
        env:
          # Testcontainers pulls postgres:11.1 automatically via Docker.
          # No external Postgres is needed; leave PG_* vars unset so
          # DatabaseRule uses the embedded Testcontainers container.
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java-17
          path: build/reports/tests/test/
          retention-days: 7

